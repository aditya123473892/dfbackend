# Production stack for api.darkfantasy.club: the published backend image behind Caddy (HTTPS).
# Run from the backend directory; deploy/deploy.sh does all of this in order:
#   docker compose --env-file .env.production -f deploy/compose.production.yml pull
#   docker compose --env-file .env.production -f deploy/compose.production.yml up -d
# MongoDB is external (Atlas); add this server's IP to Atlas Network Access.

name: darkfantasy-production

x-backend: &backend
  # Published by GitHub Actions. To build on the server instead:
  #   docker compose ... build   (uses the Dockerfile below)
  image: ${BACKEND_IMAGE:-ghcr.io/aditya123473892/dfbackend:3112026}
  build:
    context: ..
    target: runtime
  env_file:
    - ../.env.production
  environment:
    NODE_ENV: production
    PORT: 9000
    HOST: 0.0.0.0
    TRUST_PROXY: 1
  init: true

services:
  # Creates/verifies the database indexes before the API starts. Never deletes data.
  migrate:
    <<: *backend
    command: ["npm", "run", "migrate:deploy"]
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    # Only Caddy can reach the API; port 9000 is never published to the internet.
    expose:
      - "9000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  proxy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN (api.darkfantasy.club) in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for TLS certificate renewal}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
